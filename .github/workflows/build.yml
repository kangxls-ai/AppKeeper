name: Build Windows AppKeeper

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish portable EXE
        shell: pwsh
        run: |
          dotnet publish src/AppKeeper/AppKeeper.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem artifacts/win-x64 -File -Recurse)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'AppKeeper.exe') {
            throw 'Expected a single AppKeeper.exe'
          }
      - name: Run tests from the packaged EXE
        shell: pwsh
        run: |
          $env:APPKEEPER_SELFTEST_LOG = Join-Path $env:RUNNER_TEMP 'appkeeper-self-test.txt'
          $test = Start-Process -FilePath 'artifacts/win-x64/AppKeeper.exe' -ArgumentList '--self-test' -WindowStyle Hidden -PassThru -Wait
          if (Test-Path $env:APPKEEPER_SELFTEST_LOG) { Get-Content $env:APPKEEPER_SELFTEST_LOG }
          if ($test.ExitCode -ne 0) { exit $test.ExitCode }
          if (!(Test-Path $env:APPKEEPER_SELFTEST_LOG)) { throw 'Self-test did not produce a result' }
      - uses: actions/upload-artifact@v4
        with:
          name: AppKeeper-win-x64
          path: artifacts/win-x64/AppKeeper.exe
          if-no-files-found: error
